<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Modern Living Room Furniture - Halcyon Home</title>

        <link rel="stylesheet" href="css/global.css" />
        <link rel="stylesheet" href="css/productlist.css" />
    </head>
    <body>
<main class="container">
            <div class="breadcrumbs">
                HOME &rsaquo; FURNITURE &rsaquo; <span id="breadcrumb-current">MODERN LIVING ROOM</span>
            </div>

            <h1 class="page-title" id="page-title">Modern Living Room Furniture</h1>
            <p class="page-desc">
                Elevate your sanctuary with curated silhouettes. Our latest
                collection blends sculptural forms with breathable textures for
                a truly balanced home.
            </p>

            <div class="listing-layout">
                <aside class="sidebar">
                    <div class="filter-group">
                        <div class="filter-title">MATERIAL</div>
                        <label class="filter-opt">
                            <input
                                type="checkbox"
                                class="filter-mat"
                                value="Solid Walnut"
                            />
                            Solid Walnut
                        </label>
                        <label class="filter-opt">
                            <input
                                type="checkbox"
                                class="filter-mat"
                                value="Bouclé Fabric"
                            />
                            Bouclé Fabric
                        </label>
                        <label class="filter-opt">
                            <input
                                type="checkbox"
                                class="filter-mat"
                                value="Polished Marble"
                            />
                            Polished Marble
                        </label>
                        <label class="filter-opt">
                            <input
                                type="checkbox"
                                class="filter-mat"
                                value="Brushed Steel"
                            />
                            Brushed Steel
                        </label>
                        <label class="filter-opt">
                            <input
                                type="checkbox"
                                class="filter-mat"
                                value="Velvet"
                            />
                            Velvet
                        </label>
                    </div>

                    <div class="filter-group">
                        <div class="filter-title">PRICE RANGE</div>
                        <div class="price-range-labels">
                            <span>$500</span>
                            <span>$5,000+</span>
                        </div>
                    </div>

                    <div class="filter-group">
                        <div class="filter-title">COLOR PALETTE</div>
                        <div class="color-palette">
                            <div
                                class="color-swatch"
                                style="background-color: #e8e6e1"
                                title="Beige/Off-white"
                            ></div>
                            <div
                                class="color-swatch"
                                style="background-color: #1a1a1a"
                                title="Black"
                            ></div>
                            <div
                                class="color-swatch"
                                style="background-color: #4a5d4e"
                                title="Dark Green"
                            ></div>
                            <div
                                class="color-swatch"
                                style="background-color: #9e7151"
                                title="Brown/Cognac"
                            ></div>
                            <div
                                class="color-swatch"
                                style="background-color: #d1dcf5"
                                title="Light Blue"
                            ></div>
                        </div>
                    </div>
                </aside>

                <div class="main-content">
                    <div class="toolbar">
                        <div class="item-count" id="item-count">
                            Loading items...
                        </div>
                        <select class="sort-dropdown">
                            <option>Sort by: Featured</option>
                            <option>Price: Low to High</option>
                            <option>Price: High to Low</option>
                            <option>Newest Arrivals</option>
                        </select>
                    </div>

                    <div class="product-grid" id="product-grid"></div>

                    <div class="pagination">
                        <a href="#" class="page-item page-arrow">
                            <svg
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M15 19l-7-7 7-7"
                                ></path>
                            </svg>
                        </a>
                        <a href="#" class="page-item active">1</a>
                        <a href="#" class="page-item">2</a>
                        <a href="#" class="page-item">3</a>
                        <span class="page-dots">...</span>
                        <a href="#" class="page-item">12</a>
                        <a href="#" class="page-item page-arrow">
                            <svg
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M9 5l7 7-7 7"
                                ></path>
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        </main>

        <script src="js/global.js"></script>
        <script src="js/database.js"></script>
        <script src="js/products.js"></script>
    </body>
</html>
