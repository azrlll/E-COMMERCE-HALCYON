<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Modern Living Room Furniture - Halcyon Home</title>

<link rel="stylesheet" href="css/global.css" />
        <link rel="stylesheet" href="css/cart-notification.css" />
        <link rel="stylesheet" href="css/productlist.css" />
    </head>
    <body>
<main class="container">
            <div class="breadcrumbs">
                HOME &rsaquo; FURNITURE &rsaquo; <span id="breadcrumb-current">MODERN LIVING ROOM</span>
            </div>

            <h1 class="page-title" id="page-title">Modern Living Room Furniture</h1>
            <p class="page-desc">
                Elevate your sanctuary with curated silhouettes. Our latest
                collection blends sculptural forms with breathable textures for
                a truly balanced home.
            </p>

            <div class="listing-layout">
                <aside class="sidebar">
                    <div class="filter-group">
                        <div class="filter-title">MATERIAL</div>
                        <label class="filter-opt">
                            <input
                                type="checkbox"
                                class="filter-mat"
                                value="Solid Walnut"
                            />
                            Solid Walnut
                        </label>
                        <label class="filter-opt">
                            <input
                                type="checkbox"
                                class="filter-mat"
                                value="Bouclé Fabric"
                            />
                            Bouclé Fabric
                        </label>
                        <label class="filter-opt">
                            <input
                                type="checkbox"
                                class="filter-mat"
                                value="Polished Marble"
                            />
                            Polished Marble
                        </label>
                        <label class="filter-opt">
                            <input
                                type="checkbox"
                                class="filter-mat"
                                value="Brushed Steel"
                            />
                            Brushed Steel
                        </label>
                        <label class="filter-opt">
                            <input
                                type="checkbox"
                                class="filter-mat"
                                value="Velvet"
                            />
                            Velvet
                        </label>
                    </div>

<div class="filter-group">
                        <div class="filter-title">PRICE RANGE</div>
                        <div class="price-slider-container">
                            <div class="price-slider-labels">
                                <span id="price-min-label">₱0</span>
                                <span id="price-max-label">₱280,000</span>
                            </div>
                            <div class="slider-track-wrapper">
                                <div class="slider-track-background"></div>
                                <div class="slider-track-fill" id="priceFill"></div>
                                <input type="range" id="price-min" class="price-range-slider" min="0" max="5000" step="100" value="0">
                                <input type="range" id="price-max" class="price-range-slider" min="0" max="5000" step="100" value="5000">
                            </div>
                        </div>
                    </div>

                    <div class="filter-group">
                        <div class="filter-title">COLOR PALETTE</div>
                        <div class="color-palette">
                            <div
                                class="color-swatch"
                                style="background-color: #e8e6e1"
                                title="Beige/Off-white"
                            ></div>
                            <div
                                class="color-swatch"
                                style="background-color: #1a1a1a"
                                title="Black"
                            ></div>
                            <div
                                class="color-swatch"
                                style="background-color: #4a5d4e"
                                title="Dark Green"
                            ></div>
                            <div
                                class="color-swatch"
                                style="background-color: #9e7151"
                                title="Brown/Cognac"
                            ></div>
                            <div
                                class="color-swatch"
                                style="background-color: #d1dcf5"
                                title="Light Blue"
                            ></div>
                        </div>
                    </div>
                </aside>

                <div class="main-content">
                    <div class="toolbar">
                        <div class="item-count" id="item-count">
                            Loading items...
                        </div>
                        <select class="sort-dropdown">
                            <option>Sort by: Featured</option>
                            <option>Price: Low to High</option>
                            <option>Price: High to Low</option>
                            <option>Newest Arrivals</option>
                        </select>
                    </div>

                    <div class="product-grid" id="product-grid"></div>

                    <div class="pagination">
                        <a href="#" class="page-item page-arrow">
                            <svg
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M15 19l-7-7 7-7"
                                ></path>
                            </svg>
                        </a>
                        <a href="#" class="page-item active">1</a>
                        <a href="#" class="page-item">2</a>
                        <a href="#" class="page-item">3</a>
                        <span class="page-dots">...</span>
                        <a href="#" class="page-item">12</a>
                        <a href="#" class="page-item page-arrow">
                            <svg
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M9 5l7 7-7 7"
                                ></path>
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        </main>

<script src="js/global.js"></script>
        <script src="js/database.js"></script>
        <script src="js/products.js"></script>

<script>
            // Price Range Slider Functionality
            var priceMinSlider = document.getElementById('price-min');
            var priceMaxSlider = document.getElementById('price-max');
            var priceMinLabel = document.getElementById('price-min-label');
            var priceMaxLabel = document.getElementById('price-max-label');
            var priceFill = document.getElementById('priceFill');
            
            function updatePriceSlider() {
                var minVal = parseInt(priceMinSlider.value);
                var maxVal = parseInt(priceMaxSlider.value);
                
                if (minVal > maxVal) {
                    var temp = minVal;
                    minVal = maxVal;
                    maxVal = temp;
                    priceMinSlider.value = minVal;
                    priceMaxSlider.value = maxVal;
                }
                
                priceMinLabel.textContent = '₱' + (minVal * 56).toLocaleString();
                priceMaxLabel.textContent = '₱' + (maxVal * 56).toLocaleString();
                
                // Update slider track fill
                if (priceFill) {
                    var minPercent = (minVal / 5000) * 100;
                    var maxPercent = (maxVal / 5000) * 100;
                    priceFill.style.left = minPercent + '%';
                    priceFill.style.width = (maxPercent - minPercent) + '%';
                }
                
                filterProducts();
            }
            
            if (priceMinSlider && priceMaxSlider) {
                priceMinSlider.addEventListener('input', updatePriceSlider);
                priceMaxSlider.addEventListener('input', updatePriceSlider);
                // Initialize the fill on page load
                updatePriceSlider();
            }
            
            // Color Palette Filter - Make clickable
            document.querySelectorAll('.color-swatch').forEach(function(swatch) {
                swatch.style.cursor = 'pointer';
                swatch.addEventListener('click', function() {
                    this.classList.toggle('active');
                    filterProducts();
                });
            });
            
            // Enhance product cards with Add to Cart buttons
            window.renderProductsEnhanced = function(data) {
                var grid = document.getElementById('product-grid');
                if (!grid) return;
                
grid.innerHTML = data.map(function(p) {
                    return '<a href="productdetail.html?id=' + p.id + '" class="product-card">' +
                        '<div class="product-img-wrapper">' +
                            (p.badge ? '<span class="badge ' + p.badgeClass + '">' + p.badge + '</span>' : '') +
                            '<img src="' + p.img + '" alt="' + p.name + '">' +
                        '</div>' +
                        '<div class="product-info-row">' +
                            '<div class="product-name">' + p.name + '</div>' +
                            '<div class="product-price">₱' + p.price.toLocaleString() + '</div>' +
                        '</div>' +
                        '<div class="product-material">' + p.material + '</div>' +
                        '<div class="product-rating">' +
                            '<span class="filled">' + '★'.repeat(Math.floor(p.rating)) + '</span>' + 
                            '<span class="product-rating-count">(' + p.reviews + ')</span>' +
                        '</div>' +
'<button class="btn-add-product" onclick="event.preventDefault(); event.stopPropagation(); addItemToCart(' + p.id + ', event)">' +
                            '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg> Add' +
                        '</button>' +
                    '</a>';
                }).join('');
                
                document.getElementById('item-count').innerText = 'Showing ' + data.length + ' items';
            };
            
            // Override original renderProducts if exists
            if (typeof renderProducts !== 'undefined') {
                window.originalRenderProducts = renderProducts;
                window.renderProducts = renderProductsEnhanced;
                filterProducts();
            }
        </script>
    </body>
</html>
