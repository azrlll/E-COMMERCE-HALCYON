<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart - Halcyon Home</title>
    
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/cart.css" />
</head>
<body>

<main class="container">
        
        <div class="cart-header">
            <h1>Your Curated Collection</h1>
            <p id="cart-items-count">Loading...</p>
        </div>

        <div class="cart-grid">
            
            <div class="cart-items" id="cart-items-container">
                <!-- Cart items will be rendered by JavaScript -->
            </div>

            <div class="summary-wrapper">
                <div class="summary-card">
                    <h2>Order Summary</h2>
                    
<div class="summary-row">
                        <span>Subtotal</span>
                        <span class="val">₱146,440.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Shipping fee</span>
                        <span class="val">₱2,520.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Estimated Tax</span>
                        <span class="val">₱11,715.20</span>
                    </div>
                    
                    <div class="summary-divider"></div>
                    
                    <div class="total-row">
                        <span class="total-label">Total</span>
                        <span class="total-price">₱160,675.20</span>
                    </div>
                    
                    <a href="checkout.html"><button class="btn-checkout">
                        Checkout Now 
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                    </button>
                    
                    <div class="trust-badge">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                        <p>Secure payment processing with high-level encryption.</p>
                    </div>
                    <div class="trust-badge">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
<p>Complimentary white-glove delivery on orders over ₱140,000.</p>
                    </div>
                </div>

                <div class="promo-section">
                    <h3>PROMOTIONAL CODE</h3>
                    <div class="promo-input-group">
                        <input type="text" class="promo-input" placeholder="Enter code">
                        <button class="btn-apply">Apply</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

<script src="js/global.js"></script>
    <script src="js/database.js"></script>
    <script src="js/products.js"></script>
    <script>
        // Render cart items from localStorage
        document.addEventListener('DOMContentLoaded', function() {
            renderCartItems();
        });
        
function renderCartItems() {
            var cartItemsContainer = document.getElementById('cart-items-container');
            var countEl = document.getElementById('cart-items-count');
            if (!cartItemsContainer) return;
            
            var cart = getCart();
            var totalQty = cart.items.reduce(function(sum, item) { return sum + item.qty; }, 0);
            
            if (cart.items.length === 0) {
                cartItemsContainer.innerHTML = '<div class="empty-cart-message"><p>Your cart is empty.</p><a href="productlist.html" class="btn-shop-now">Shop Now</a></div>';
                if (countEl) countEl.textContent = 'YOUR CART IS EMPTY';
                var summaryCard = document.querySelector('.summary-card');
                if (summaryCard) summaryCard.innerHTML = '<p>Your cart is empty.</p>';
                return;
            }
            
            // Update header count
            if (countEl) countEl.textContent = totalQty + ' ITEM' + (totalQty > 1 ? 'S' : '') + ' SELECTED FOR YOUR INTERIOR';
            
            // Render each item with PHP currency
            cartItemsContainer.innerHTML = cart.items.map(function(item) {
                var itemTotal = item.qty * item.price;
                return '<div class="cart-item" data-id="' + item.id + '">' +
                    '<div class="item-image">' +
                        '<img src="' + item.img + '" alt="' + item.name + '">' +
                    '</div>' +
                    '<div class="item-details">' +
                        '<span class="item-tag">' + item.name + '</span>' +
                        '<div class="item-header-row">' +
                            '<h3 class="item-title">' + item.name + '</h3>' +
                            '<span class="item-price">₱' + itemTotal.toLocaleString() + '.00</span>' +
                        '</div>' +
                        '<p class="item-subtitle">Qty: ' + item.qty + '</p>' +
                        '<div class="item-controls">' +
                            '<div class="qty-selector">' +
                                '<button class="qty-btn" onclick="changeQty(' + item.id + ', -1)">&minus;</button>' +
                                '<input type="text" class="qty-input" value="' + item.qty + '" readonly>' +
                                '<button class="qty-btn" onclick="changeQty(' + item.id + ', 1)">+</button>' +
                            '</div>' +
                            '<button class="btn-remove" onclick="removeItem(' + item.id + ')">' +
                                '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>' +
                                'Remove' +
                            '</button>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
            
            // Update summary
            updateCartSummary();
        }
        
        function changeQty(productId, delta) {
            var cart = getCart();
            var item = cart.items.find(function(i) { return i.id === productId; });
            
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart.items = cart.items.filter(function(i) { return i.id !== productId; });
                }
                cart.subtotal = cart.items.reduce(function(sum, i) { return sum + (i.qty * i.price); }, 0);
                setCart(cart);
                updateCartBadge();
                renderCartItems();
            }
        }
        
        function removeItem(productId) {
            // No confirmation: immediate removal per UX request
            removeFromCart(productId);
            renderCartItems();
        }

        
function updateCartSummary() {
            var cart = getCart();
            var subtotal = cart.subtotal || 0;
            var shipping = subtotal > 0 ? 450 : 0;
            var tax = Math.round(subtotal * 0.08);
            var total = subtotal + shipping + tax;
            
            var summaryCard = document.querySelector('.summary-card');
            if (summaryCard) {
                summaryCard.innerHTML = '<h2>Order Summary</h2>' +
                    '<div class="summary-row"><span>Subtotal</span><span class="val">₱' + subtotal.toLocaleString() + '.00</span></div>' +
                    '<div class="summary-row"><span>Shipping fee</span><span class="val">₱' + shipping.toLocaleString() + '.00</span></div>' +
                    '<div class="summary-row"><span>Estimated Tax</span><span class="val">₱' + tax.toLocaleString() + '.00</span></div>' +
                    '<div class="summary-divider"></div>' +
                    '<div class="total-row"><span class="total-label">Total</span><span class="total-price">₱' + total.toLocaleString() + '.00</span></div>' +
                    '<a href="checkout.html"><button class="btn-checkout">Checkout Now <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg></button></a>' +
                    '<div class="trust-badge"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg><p>Secure payment processing with high-level encryption.</p></div>' +
                    '<div class="trust-badge"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg><p>Complimentary white-glove delivery on orders over ₱125,000.</p></div>';
            }
        }
        
        // Make functions globally available
        window.changeQty = changeQty;
        window.removeItem = removeItem;
    </script>
</body>
</html>
